server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Los assets deben existir físicamente.
    # Si no existen, devolver 404, no index.html.
    location /assets/ {
        try_files $uri =404;
    }

    # React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
