server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Selfie y hasta cuatro fotogramas de vida (8 MB por imagen, más el formulario).
    client_max_body_size 50m;

    # Redirecciones relativas (evita que Nginx genere http://host:80/...)
    absolute_redirect off;

    # BEGIN_BASE_PATH
    # Si el proxy (Dokploy/Traefik) NO quita el prefijo, se quita aquí:
    #   __BASE_PATH__/assets/x.js -> /assets/x.js
    # Si el proxy SÍ lo quita, estas reglas simplemente no aplican.
    # __BASE_PATH__ se reemplaza en el Dockerfile con VITE_BASE_PATH.
    location = __BASE_PATH__ {
        return 301 __BASE_PATH__/;
    }

    location ^~ __BASE_PATH__/ {
        rewrite ^__BASE_PATH__/(.*)$ /$1 last;
    }
    # END_BASE_PATH

    # API del mismo sitio: también recibe /api después de quitar el prefijo público.
    # DNS de Docker en ejecución: el build no necesita resolver el servicio backend.
    resolver 127.0.0.11 valid=30s ipv6=off;
    location ^~ /api/ {
        set $api_backend backend:8080;
        proxy_pass http://$api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Los assets deben existir físicamente: 404 en vez de index.html.
    # Llevan hash en el nombre, así que pueden cachearse para siempre.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Modelos de detección de rostros (~6 MB): cambian solo al actualizar @vladmandic/face-api
    location ^~ /models/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Otros archivos estáticos (logo, favicon...): 404 si no existen.
    # Nunca devolver index.html aquí: Cloudflare lo cachearía como imagen.
    location ~* \.(?:png|jpe?g|gif|svg|ico|webp|css|js|map|woff2?|ttf|txt)$ {
        try_files $uri =404;
    }

    # React Router. index.html sin caché para que cada deploy se vea al instante.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
