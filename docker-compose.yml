services:
  db:
    image: postgres:16-alpine
    container_name: finanecuador_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: finanecuador
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finanecuador"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - finanecuador_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finanecuador_backend
    restart: unless-stopped
    environment:
      PORT: 8080
      NODE_ENV: development
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: finanecuador
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SYNC_ALTER: "false"
      JWT_SECRET: development-secret
      FRONTEND_URL: http://localhost:5173
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - finanecuador_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finanecuador_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8080/api
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - finanecuador_net

volumes:
  postgres_data:
  uploads_data:

networks:
  finanecuador_net:
    driver: bridge
